<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Trading Agent — Control Panel</title>
<style>
  :root {
    --bg: #0b1220; --panel: #121b2e; --border: #223049;
    --text: #e6ecf5; --muted: #7e8ba3;
    --accent: #4fb3bf; --good: #4caf7d; --bad: #d9695f; --warn: #d1a24a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; padding: 16px 24px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--warn); border: 1px solid var(--warn); border-radius: 4px;
    padding: 2px 6px;
  }
  main {
    padding: 20px 24px; display: grid; gap: 18px;
    grid-template-columns: 320px 1fr; align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
  }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .col { display: flex; flex-direction: column; gap: 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=password], input[type=date], select {
    width: 100%; background: #0e1626; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 9px; font-size: 13px; margin-bottom: 12px;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .checks { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); }
  .radios { display: flex; gap: 8px; margin-bottom: 12px; }
  .radios label {
    flex: 1; text-align: center; padding: 7px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; margin: 0; color: var(--text); font-size: 12px;
  }
  .radios input { display: none; }
  .radios input:checked + span { color: var(--accent); font-weight: 600; }
  .radios label:has(input:checked) { border-color: var(--accent); background: rgba(79,179,191,.08); }
  .hidden { display: none !important; }
  button {
    font: inherit; border-radius: 6px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--border);
    background: #0e1626; color: var(--text);
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06222a; font-weight: 600; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat {
    background: #0e1626; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .up { color: var(--good); } .down { color: var(--bad); }
  canvas { width: 100%; height: 140px; display: block; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .pill.idle, .pill.stopped { background: rgba(126,139,163,.15); color: var(--muted); }
  .pill.running { background: rgba(76,175,125,.15); color: var(--good); }
  .pill.paused { background: rgba(209,162,74,.15); color: var(--warn); }
  .pill.completed { background: rgba(79,179,191,.15); color: var(--accent); }
  .pill.error, .pill.blocked { background: rgba(217,105,95,.15); color: var(--bad); }
  .pill.pending_approval { background: rgba(76,175,125,.15); color: var(--good); }
  #thoughts {
    max-height: 420px; overflow-y: auto; font-size: 12.5px;
  }
  .thought { border-bottom: 1px solid var(--border); padding: 8px 0; }
  .thought:last-child { border-bottom: none; }
  .thought .meta { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  .thought .tag {
    display: inline-block; background: #0e1626; border: 1px solid var(--border); border-radius: 4px;
    padding: 0 5px; margin-right: 6px; color: var(--accent); font-size: 10.5px;
  }
  .empty { color: var(--muted); font-size: 13px; }
  .export-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .export-links a, .export-links button { font-size: 12px; }
  a { color: var(--accent); text-decoration: none; }
  @media print {
    header .controls, .export-links, #panel-config { display: none !important; }
    body { background: white; color: black; }
  }
</style>
</head>
<body>
<header>
  <h1>Trading Agent — Control Panel</h1>
  <span class="badge">Autonomous · Paper Only · Not Investment Advice</span>
  <span id="status-pill" class="pill idle" style="margin-left:auto;">idle</span>
</header>

<main>
  <div class="col">
    <div class="panel" id="panel-config">
      <h2>설정</h2>

      <label>모드</label>
      <div class="radios">
        <label><input type="radio" name="mode" value="signal" checked><span>신호 1회</span></label>
        <label><input type="radio" name="mode" value="watch"><span>연속 실행</span></label>
        <label><input type="radio" name="mode" value="backtest"><span>백테스트</span></label>
      </div>

      <label>종목 (실시간 사용 시 실제 티커, 예: 000660.KS, AAPL)</label>
      <input type="text" id="symbol" value="SK_HYNIX">

      <div class="row">
        <div>
          <label>레버리지 (요청값 — 안전 한도로 자동 조정됨)</label>
          <input type="number" id="leverage" value="1" step="0.5" min="0">
        </div>
        <div>
          <label>분할 매수/매도 횟수</label>
          <input type="number" id="tranches" value="2" step="1" min="1">
        </div>
      </div>

      <div class="checks">
        <label><input type="checkbox" id="use_live"> 실시간 시세 (Yahoo Finance)</label>
        <label><input type="checkbox" id="use_kronos"> Kronos 예측 모델</label>
      </div>

      <div id="watch-only" class="hidden">
        <label>반복 주기 (초)</label>
        <input type="number" id="interval_seconds" value="15" min="1">
      </div>

      <div id="backtest-only" class="hidden">
        <div class="row">
          <div>
            <label>기간 (--live 사용 시, 예: 6mo, 1y)</label>
            <input type="text" id="period" value="6mo">
          </div>
          <div>
            <label>워밍업 봉 수</label>
            <input type="number" id="min_lookback" value="35" min="2">
          </div>
        </div>
        <div class="row">
          <div>
            <label>시작일 (선택, --live 필요)</label>
            <input type="date" id="start_date">
          </div>
          <div>
            <label>종료일 (선택, --live 필요)</label>
            <input type="date" id="end_date">
          </div>
        </div>
      </div>

      <label>ANTHROPIC_API_KEY (선택 — 없으면 임시 요약 문구로 동작)</label>
      <input type="password" id="api_key" placeholder="비워두면 서버 환경변수 사용">

      <div class="controls">
        <button class="primary" id="btn-create">세션 만들기</button>
      </div>
      <div class="controls" style="margin-top:10px;">
        <button id="btn-start" disabled>시작</button>
        <button id="btn-pause" disabled>일시정지</button>
        <button id="btn-resume" disabled>재개</button>
        <button id="btn-stop" disabled>중단</button>
        <button id="btn-reset" disabled>리셋</button>
      </div>
    </div>

    <div class="panel">
      <h2>내보내기</h2>
      <div class="export-links">
        <a id="export-json" href="#" target="_blank">JSON</a>
        <a id="export-csv" href="#" target="_blank">CSV</a>
        <a id="export-md" href="#" target="_blank">Markdown</a>
        <button onclick="window.print()">PDF로 저장</button>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="panel">
      <h2>현재 상태</h2>
      <div class="stats">
        <div class="stat"><div class="label">Symbol</div><div class="value" id="s-symbol">—</div></div>
        <div class="stat"><div class="label">Paper Equity</div><div class="value" id="s-equity">—</div></div>
        <div class="stat"><div class="label">Realized PnL</div><div class="value" id="s-pnl">—</div></div>
        <div class="stat"><div class="label">Open Positions</div><div class="value" id="s-positions">—</div></div>
        <div class="stat"><div class="label">Ticks</div><div class="value" id="s-ticks">—</div></div>
      </div>
      <canvas id="chart" width="1000" height="140"></canvas>
      <div id="positions-wrap"><div class="empty">아직 포지션이 없습니다</div></div>
    </div>

    <div class="panel" id="performance-panel" style="display:none;">
      <h2>백테스트 성과 지표</h2>
      <div class="stats" id="performance-stats"></div>
      <div class="empty">과거 데이터 기준입니다. 미래 수익을 보장하지 않습니다.</div>
    </div>

    <div class="panel">
      <h2>실행 로그 · 사고 과정</h2>
      <div id="thoughts"><div class="empty">세션을 시작하면 여기에 표시됩니다</div></div>
    </div>
  </div>
</main>

<script>
let sessionId = null;
let ws = null;
let equityHistory = [];
let tickCount = 0;

function fmt(n) { return Number(n).toLocaleString(undefined, {maximumFractionDigits: 0}); }
function pct(n) { return (n * 100).toFixed(2) + '%'; }

function setPill(state) {
  const el = document.getElementById('status-pill');
  el.textContent = state;
  el.className = 'pill ' + state;
}

function updateModeVisibility() {
  const mode = document.querySelector('input[name=mode]:checked').value;
  document.getElementById('watch-only').classList.toggle('hidden', mode !== 'watch');
  document.getElementById('backtest-only').classList.toggle('hidden', mode !== 'backtest');
}
document.querySelectorAll('input[name=mode]').forEach(el => el.addEventListener('change', updateModeVisibility));
updateModeVisibility();

function drawChart() {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (equityHistory.length < 2) {
    ctx.fillStyle = '#7e8ba3';
    ctx.fillText('데이터가 쌓이면 여기에 자산 곡선이 나타납니다', 10, h / 2);
    return;
  }
  const min = Math.min(...equityHistory), max = Math.max(...equityHistory);
  const pad = (max - min) * 0.1 || 1;
  const lo = min - pad, hi = max + pad;

  ctx.strokeStyle = '#223049';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = (h / 3) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.beginPath();
  ctx.strokeStyle = '#4fb3bf';
  ctx.lineWidth = 2;
  equityHistory.forEach((e, i) => {
    const x = (i / (equityHistory.length - 1)) * (w - 4) + 2;
    const y = h - ((e - lo) / (hi - lo)) * (h - 4) - 2;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function renderPositions(positions) {
  const entries = Object.entries(positions || {});
  const el = document.getElementById('positions-wrap');
  if (entries.length === 0) { el.innerHTML = '<div class="empty">아직 포지션이 없습니다</div>'; return; }
  const rows = entries.map(([sym, p]) => `
    <tr>
      <td>${sym}</td>
      <td class="${p.quantity >= 0 ? 'up' : 'down'}">${p.quantity >= 0 ? 'LONG' : 'SHORT'}</td>
      <td>${fmt(Math.abs(p.quantity))}</td>
      <td>${fmt(p.avg_entry_price)}</td>
      <td>${p.leverage}x</td>
      <td>${fmt(p.stop_loss_price)}</td>
    </tr>`).join('');
  el.innerHTML = `<table><thead><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Avg entry</th><th>Leverage</th><th>Stop</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function addThought(html) {
  const wrap = document.getElementById('thoughts');
  if (wrap.querySelector('.empty')) wrap.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'thought';
  div.innerHTML = html;
  wrap.prepend(div);
  while (wrap.children.length > 200) wrap.removeChild(wrap.lastChild);
}

function timeLabel(ts) { return new Date(ts * 1000).toLocaleTimeString(); }

function renderThoughtStage(ts, stage, d) {
  const time = timeLabel(ts);
  if (stage === 'analyst_report') {
    const r = d.report;
    addThought(`<div class="meta">${time} <span class="tag">${r.agent_name}</span></div>${r.signal} (conf ${r.confidence.toFixed(2)}) — ${r.summary}`);
  } else if (stage === 'research_debate') {
    const r = d.research;
    addThought(`<div class="meta">${time} <span class="tag">research_manager</span></div>consensus=${r.consensus_signal} (conf ${r.consensus_confidence.toFixed(2)}) — ${r.rationale}`);
  } else if (stage === 'trade_plan_drafted') {
    const p = d.plan;
    addThought(`<div class="meta">${time} <span class="tag">trader</span></div>${p.action.toUpperCase()} ${p.symbol} @ ${fmt(p.entry_price)} | target ${fmt(p.target_price)} | stop ${fmt(p.stop_loss_price)} — ${p.rationale}`);
  } else if (stage === 'risk_debate_aggressive') {
    addThought(`<div class="meta">${time} <span class="tag">aggressive</span></div>${d.text}`);
  } else if (stage === 'risk_debate_conservative') {
    addThought(`<div class="meta">${time} <span class="tag">conservative</span></div>${d.text}`);
  } else if (stage === 'risk_debate_moderator') {
    addThought(`<div class="meta">${time} <span class="tag">moderator</span></div>${d.text}`);
  } else if (stage === 'risk_verdict') {
    const v = d.verdict;
    const notes = (v.violations_corrected || []).join('; ');
    addThought(`<div class="meta">${time} <span class="tag">risk_verdict</span></div>approved=${v.approved} leverage=${v.adjusted_leverage}x pct=${pct(v.adjusted_position_pct_of_equity)}${notes ? ' — ' + notes : ''}`);
  }
}

function handleEvent(evt) {
  const d = evt.data || {};
  if (evt.kind === 'status') {
    setPill(d.state);
    updateControlButtons(d.state);
  } else if (evt.kind === 'error') {
    addThought(`<div class="meta">${timeLabel(evt.ts)} <span class="tag" style="color:#d9695f;">error</span></div>${d.message}`);
  } else if (evt.kind === 'thought') {
    renderThoughtStage(evt.ts, d.stage, d);
  } else if (evt.kind === 'decision' || evt.kind === 'tick') {
    const plan = d.artifacts.decision.trade_plan;
    const status = d.artifacts.decision.status;
    tickCount += 1;
    document.getElementById('s-ticks').textContent = tickCount;
    let note = d.booked ? ' → booked' : '';
    if (d.stopped_out && d.stopped_out.length) note += ` · stopped out: ${d.stopped_out.join(', ')}`;
    addThought(`<div class="meta">${timeLabel(evt.ts)} <span class="tag">decision</span></div>${plan.action.toUpperCase()} ${plan.symbol} @ ${fmt(plan.entry_price)} <span class="pill ${status}">${status}</span>${note}`);
    if (d.equity !== undefined) {
      equityHistory.push(d.equity);
      drawChart();
    }
  } else if (evt.kind === 'portfolio') {
    document.getElementById('s-equity').textContent = fmt(d.equity);
    const pnlEl = document.getElementById('s-pnl');
    pnlEl.textContent = fmt(d.realized_pnl);
    pnlEl.className = 'value ' + (d.realized_pnl > 0 ? 'up' : d.realized_pnl < 0 ? 'down' : '');
    document.getElementById('s-positions').textContent = Object.keys(d.positions || {}).length;
    renderPositions(d.positions);
    if (!equityHistory.length || equityHistory[equityHistory.length - 1] !== d.equity) {
      equityHistory.push(d.equity);
      drawChart();
    }
  } else if (evt.kind === 'final_report') {
    const p = d.performance;
    document.getElementById('performance-panel').style.display = '';
    document.getElementById('performance-stats').innerHTML = `
      <div class="stat"><div class="label">Total Return</div><div class="value ${p.total_return_pct >= 0 ? 'up' : 'down'}">${pct(p.total_return_pct)}</div></div>
      <div class="stat"><div class="label">Max Drawdown</div><div class="value down">${pct(p.max_drawdown_pct)}</div></div>
      <div class="stat"><div class="label">Win Rate</div><div class="value">${p.win_rate !== null ? pct(p.win_rate) : '—'}</div></div>
      <div class="stat"><div class="label">Closed Trades</div><div class="value">${p.num_closed_trades}</div></div>
      <div class="stat"><div class="label">Sharpe-like</div><div class="value">${p.sharpe_ratio !== null ? p.sharpe_ratio.toFixed(2) : '—'}</div></div>
      <div class="stat"><div class="label">Sortino-like</div><div class="value">${p.sortino_ratio !== null ? p.sortino_ratio.toFixed(2) : '—'}</div></div>
    `;
  }
}

function updateControlButtons(state) {
  const has = sessionId !== null;
  document.getElementById('btn-start').disabled = !has || state === 'running';
  document.getElementById('btn-pause').disabled = !has || state !== 'running';
  document.getElementById('btn-resume').disabled = !has || state !== 'paused';
  document.getElementById('btn-stop').disabled = !has || (state !== 'running' && state !== 'paused');
  document.getElementById('btn-reset').disabled = !has;
}

async function createSession() {
  const mode = document.querySelector('input[name=mode]:checked').value;
  const payload = {
    mode,
    symbol: document.getElementById('symbol').value.trim(),
    leverage: parseFloat(document.getElementById('leverage').value),
    tranches: parseInt(document.getElementById('tranches').value, 10),
    use_live: document.getElementById('use_live').checked,
    use_kronos: document.getElementById('use_kronos').checked,
    interval_seconds: parseFloat(document.getElementById('interval_seconds').value),
    period: document.getElementById('period').value,
    start_date: document.getElementById('start_date').value || null,
    end_date: document.getElementById('end_date').value || null,
    min_lookback: parseInt(document.getElementById('min_lookback').value, 10),
    anthropic_api_key: document.getElementById('api_key').value || null,
  };

  const res = await fetch('/api/sessions', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
  });
  const body = await res.json();
  sessionId = body.session_id;
  equityHistory = [];
  tickCount = 0;
  document.getElementById('thoughts').innerHTML = '<div class="empty">세션이 생성되었습니다. "시작"을 눌러주세요.</div>';
  document.getElementById('performance-panel').style.display = 'none';

  document.getElementById('export-json').href = `/api/sessions/${sessionId}/export.json`;
  document.getElementById('export-csv').href = `/api/sessions/${sessionId}/export.csv`;
  document.getElementById('export-md').href = `/api/sessions/${sessionId}/export.md`;

  connectSocket();
  updateControlButtons('idle');
}

function connectSocket() {
  if (ws) ws.close();
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${protocol}://${location.host}/ws/${sessionId}`);
  ws.onmessage = (msg) => handleEvent(JSON.parse(msg.data));
}

function sendControl(action) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({action}));
  }
}

document.getElementById('btn-create').addEventListener('click', createSession);
document.getElementById('btn-start').addEventListener('click', () => sendControl('start'));
document.getElementById('btn-pause').addEventListener('click', () => sendControl('pause'));
document.getElementById('btn-resume').addEventListener('click', () => sendControl('resume'));
document.getElementById('btn-stop').addEventListener('click', () => sendControl('stop'));
document.getElementById('btn-reset').addEventListener('click', () => {
  sendControl('reset');
  equityHistory = [];
  tickCount = 0;
  drawChart();
  document.getElementById('thoughts').innerHTML = '<div class="empty">리셋되었습니다.</div>';
  document.getElementById('performance-panel').style.display = 'none';
});

drawChart();
</script>
</body>
</html>
