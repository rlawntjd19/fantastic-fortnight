name: Ad hoc SKHY deep verify (temporary)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-live.txt
      - name: Run verify
        env:
          PYTHONPATH: .
        run: python scripts/adhoc_skhy_verify.py
