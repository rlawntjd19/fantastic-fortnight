name: Ad hoc CRWV eligibility check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-live.txt
      - run: python scripts/adhoc_check_crwv.py
