name: Ad hoc rebuild with CRWV / SK Hynix check (temporary)

on:
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-live.txt

      - name: Run the rebuild check
        env:
          PYTHONPATH: .
        run: |
          python scripts/adhoc_rebuild_with_crwv.py
